# Workspace root for the Rust port of fleet-check. fleet.toml sits beside this
# file and stays the single source of truth for engines and hosts.
#
[workspace]
resolver = "2"
members = ["crates/fleet-core", "crates/fleet-check-rs", "crates/fleet-mcp", "crates/fleet-stopgap", "crates/parity"]

[workspace.package]
edition = "2021"
license = "GPL-2.0-only"

[workspace.dependencies]
serde_json = "1"
toml = "1"
ureq = { version = "3.4.2", default-features = false }
