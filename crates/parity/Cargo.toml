[package]
name = "parity"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Replays the mock-engine scenarios from crates/parity.py against fleet-check-rs and compares the verdicts to committed goldens"
publish = false

[[bin]]
name = "parity-rs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
libc = "0.2"
